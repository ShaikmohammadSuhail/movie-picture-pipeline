name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  ECR_REPOSITORY: mp-frontend
  REACT_APP_MOVIE_API_URL: http://mp-backend:5000

jobs:
  lint:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: "frontend/.nvmrc"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-npm-

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  test:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: "frontend/.nvmrc"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-npm-

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: CI=true npm test

  build:
    name: Build and Push Frontend
    runs-on: ubuntu-latest
    needs: [lint, test]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            --build-arg=REACT_APP_MOVIE_API_URL=${{ env.REACT_APP_MOVIE_API_URL }} \
            --tag=${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} .
          docker tag ${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} ${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:latest

      - name: Push docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push ${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker push ${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:latest

  deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [build]
    defaults:
      run:
        working-directory: frontend/k8s
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update kubeconfig for EKS cluster
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v1
        with:
          kustomize-version: "5.0.1"

      - name: Set image tag in manifests
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          kustomize edit set image \
            frontend=${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy application to EKS
        run: kustomize build | kubectl apply -f -

      - name: Verify deployment
        run: kubectl rollout status deployment/mp-frontend --timeout=120s

      - name: Wait for frontend public URL
        id: frontend-url
        shell: bash
        run: |
          for attempt in {1..40}; do
            FRONTEND_HOSTNAME=$(kubectl get svc mp-frontend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            FRONTEND_IP=$(kubectl get svc mp-frontend -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            if [ -n "${FRONTEND_HOSTNAME}" ]; then
              echo "url=http://${FRONTEND_HOSTNAME}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -n "${FRONTEND_IP}" ]; then
              echo "url=http://${FRONTEND_IP}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "Frontend LoadBalancer URL was not assigned within the expected time." >&2
          exit 1

      - name: Verify frontend URL responds
        run: |
          url="${{ steps.frontend-url.outputs.url }}"
          echo "Verifying ${url} (waiting up to ~3 minutes for the ELB to start serving)..."
          for attempt in {1..18}; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 10 "${url}" || true)
            echo "  attempt ${attempt}: HTTP ${code}"
            if [ "${code}" = "200" ] || [ "${code}" = "301" ] || [ "${code}" = "302" ]; then
              echo "Frontend URL responded successfully."
              exit 0
            fi
            sleep 10
          done
          echo "ERROR: Frontend URL ${url} did not respond with a success status within 3 minutes (last HTTP code: ${code})." >&2
          curl -sS "${url}" || true
          exit 1

      - name: Publish frontend URL
        run: |
          echo "Frontend public URL: ${{ steps.frontend-url.outputs.url }}"
          {
            echo "## Frontend deployment"
            echo
            echo "Public URL: ${{ steps.frontend-url.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
