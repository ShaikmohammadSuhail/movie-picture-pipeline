apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp-backend
  labels:
    app: mp-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mp-backend
  template:
    metadata:
      labels:
        app: mp-backend
    spec:
      containers:
        - name: backend
          image: backend
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
